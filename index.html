<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des dossiers patient</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body class="container">

    <h3> GESTION DES DOSSIERS DES PATIENTS </h3>

    <p>Cette application a pour but d'enrégistrer,de consulter et de rentre plus facile
        la recherche des informations médicale d'un patient dans un centre de santé</p>

    <span class="avatar" style="--bs-avatar-size: 8rem;">
        <img class="avatar-img" src="patient.png" alt="image du carnet">
    </span>

    <h4>Formulaire d'enrégistrement du patient</h4>

    <div class="row">
        <div class="col-4">
            <form>
                <label class="form-label">Nom du patient :</label>
                <input class="form-control" type="text" placeholder="Entrer le nom" required>

                <label class="form-label">Prenom :</label>
                <input class="form-control" type="text" placeholder="Entrer le Prenom" required>

                <label class="form-label">Date de naissance :</label>
                <input class="form-control" type="date">

                <label class="form-label">Sexe :</label>
                <select class="form-control">
                    <option>Choisir le sexe</option>
                    <option>Masculin</option>
                    <option>Féminin</option>
                </select>

                <label class="form-label">Téléphone :</label>
                <input class="form-control" type="tel" placeholder="Entrer le numéro">

                <label class="form-label"> Adresse :</label>
                <input class="form-control" type="text" placeholder="Entrer l'adresse" required>

                <label class="form-label">Motif de consultation :</label>
                <textarea class="form-control" rows="2" placeholder="Entrer le Motif"></textarea> <br />
                <button class="btn-solid theme-success" type="submit">Enrégistrer le patient</button>
                <button class="btn-outline theme-danger" type="reset">Réinitialiser</button>

            </form>
        </div>
    </div>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
